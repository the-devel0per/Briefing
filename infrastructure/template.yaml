AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Personalized AI news platform (serverless)

Parameters:
  Stage: {Type: String, Default: prod}
  AllowedOrigin: {Type: String, Default: "http://localhost:5173", Description: "Frontend origin for CORS (set to the CloudFront URL after first deploy, then redeploy)"}
  GeminiKeyParam: {Type: String, Default: news/gemini-api-key, Description: "SSM SecureString name, no leading slash"}
  SessionSecretParam: {Type: String, Default: news/session-secret, Description: "SSM SecureString name, no leading slash"}
  GeminiModel: {Type: String, Default: gemini-3.5-flash}
  GeminiDailyCallCap: {Type: Number, Default: 150}
  IngestSchedule: {Type: String, Default: "rate(1 hour)"}
  EnableOgFetch: {Type: String, Default: "false", AllowedValues: ["true", "false"]}
  AlertEmail: {Type: String, Description: "Receives alarms and budget alerts"}
  MonthlyBudgetUsd: {Type: Number, Default: 10}

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        ARTICLES_TABLE: !Ref ArticlesTable
        USERS_TABLE: !Ref UsersTable
        GEMINI_KEY_PARAM: !Ref GeminiKeyParam
        SESSION_SECRET_PARAM: !Ref SessionSecretParam
        GEMINI_MODEL: !Ref GeminiModel
        GEMINI_DAILY_CALL_CAP: !Ref GeminiDailyCallCap
        ENABLE_OG_FETCH: !Ref EnableOgFetch
        ALLOWED_ORIGINS: !Ref AllowedOrigin

Resources:
  ArticlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: day, AttributeType: S}
        - {AttributeName: score, AttributeType: N}
      GlobalSecondaryIndexes:
        - IndexName: PoolByScore
          KeySchema: [{AttributeName: day, KeyType: HASH}, {AttributeName: score, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema: [{AttributeName: userId, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings: {ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.api.handler.handler
      ReservedConcurrentExecutions: 10
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ArticlesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - SSMParameterReadPolicy: {ParameterName: !Ref GeminiKeyParam}
        - SSMParameterReadPolicy: {ParameterName: !Ref SessionSecretParam}
      Events:
        Any:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: "/api/{proxy+}", Method: ANY}

  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.ingestion.handler.handler
      Timeout: 120
      MemorySize: 512
      ReservedConcurrentExecutions: 1
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ArticlesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - SSMParameterReadPolicy: {ParameterName: !Ref GeminiKeyParam}
      Events:
        Schedule:
          Type: ScheduleV2
          Properties: {ScheduleExpression: !Ref IngestSchedule, Name: !Sub "news-ingestion-${Stage}"}

  HeadlineBackfillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.headline_generation.handler.handler
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ArticlesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - SSMParameterReadPolicy: {ParameterName: !Ref GeminiKeyParam}

  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: functions.cleanup.handler.handler
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ArticlesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
      Events:
        Daily:
          Type: ScheduleV2
          Properties: {ScheduleExpression: "cron(30 3 * * ? *)", Name: !Sub "news-cleanup-${Stage}"}

  # ---- frontend hosting: private S3 bucket served through CloudFront (OAC) ----
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: {Name: !Sub "news-oac-${Stage}", OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          Compress: true
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition: {StringEquals: {"AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"}}

  # ---- monitoring and cost alerts (alerts only: AWS Budgets is NOT a hard spending cap) ----
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  IngestionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref IngestionFunction}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  DynamoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions: [{Name: TableName, Value: !Ref UsersTable}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "news-platform-${Stage}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  ApiUrl: {Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"}
  SiteUrl: {Value: !Sub "https://${Distribution.DomainName}"}
  SiteBucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
